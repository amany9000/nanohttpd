# Organization of the specs generated by the agents.
# This section is filled by Reversa after the Scout suggests a structure
# and the user confirms the choice in the menu (right after the doc_level question).
# To show the menu again, remove the whole [specs] section and run Reversa again.
[specs]
layout = "feature-folder"
granularity = "module"
custom_folders = []
scout_suggestion = "module"
decided_at = "2026-10-24T07:57:03Z"
